# On every push and pull request: format, unit tests and every game in Dinghy's host mode (no FM-1 needed), every
# game built as an FM-1 firmware (.fwsc) and as a browser simulator, then the site (simulators, web installer and
# packages), all downloadable from the run's artifacts. On main the site goes to GitHub Pages; the site of a pull
# request goes to <site>/pr-<number>/ (preview.yml).
# The JieLi toolchain comes from pkgman.jieliapp.com and the AC79 SDK from gitee.com, as in Dinghy's own workflow.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get install -y clang-format
          python3 -m pip install Pillow

      - name: Format
        run: make format-check

      - name: Unit tests
        run: make test

      - name: Web installer on a fake FM-1
        run: node tools/installer/test.mjs

      - name: The firmware on a fake FM-1
        run: make host

      - uses: actions/upload-artifact@v4
        with:
          name: host-screens
          path: build/host/*.png

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh platform/tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it go into each package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: The firmware, with every game
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          python3 tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*/*.fwsc
          if-no-files-found: error

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get install -y clang lld

      - name: The firmware as a browser simulator
        run: |
          make sim
          node tools/sim/smoke.mjs build/sim/insert-coin.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: build/site
          if-no-files-found: error

  site:
    needs: [firmware, simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: simulator
          path: build/site

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/firmware

      - name: Web installer with every package
        run: python3 tools/installer/bundle.py build/site $(find build/firmware -name "*.fwsc")

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
          if-no-files-found: error

  # main's site at the root of the published tree (the gh-pages branch), keeping the previews of the pull
  # requests in their pr-<number> folders (preview.yml)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build/site

      - uses: ./.github/actions/publish-pages
        with:
          site: build/site
          target: .
          message: Publish main at ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
