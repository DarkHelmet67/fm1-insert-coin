<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM-1 installer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <a class="back" href="../">fm1-insert-coin</a>
    <button class="lang" id="lang" type="button">English</button>
  </header>
  <h1 data-t="title">Install the games on your FM-1</h1>
  <p class="lead" data-t="intro"></p>

  <fieldset class="games" id="games">
    <legend data-t="choose"></legend>
  </fieldset>

  <button class="go" id="go" type="button" disabled data-t="install"></button>
  <progress id="bar" max="100" value="0"></progress>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <details class="log">
    <summary data-t="details"></summary>
    <pre id="log"></pre>
  </details>

  <section class="notes">
    <h2 data-t="beforeTitle"></h2>
    <ul>
      <li data-t="cable"></li>
      <li data-t="warn"></li>
      <li data-t="rescue"></li>
      <li data-t="back"></li>
      <li data-t="risk"></li>
    </ul>
    <p class="small"><span data-t="credits"></span>
      <a href="https://github.com/hugelton/Felucca">Felucca</a>,
      <a href="https://github.com/illuminus5/skiff">Skiff</a>,
      <a href="https://github.com/zvenson/dinghy">Dinghy</a>.
      <span data-t="license"></span>
      <a href="https://github.com/DarkHelmet67/fm1-insert-coin">github.com/DarkHelmet67/fm1-insert-coin</a></p>
  </section>
</main>
<script type="module" src="installer.js"></script>
</body>
</html>
